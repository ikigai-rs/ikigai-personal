[package]
name = "ikigai-personal"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Personal contexts for ikigai — OS-backed resources (contacts, calendar, availability) under urn:personal:*. macOS-first; Windows and Linux build but report unsupported for now."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-personal"
homepage = "https://github.com/ikigai-rs/ikigai-personal"
readme = "README.md"
keywords = ["ikigai", "roc", "personal", "calendar", "contacts"]
categories = ["os"]

[dependencies]
ikigai-core = "0.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Real EventKit access, macOS only — the other platforms keep their clear
# "not supported yet" answer without pulling Apple frameworks.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
objc2-event-kit = { version = "0.3", features = [
    "EKEventStore",
    "EKCalendar",
    "EKCalendarItem",
    "EKSource",
    "EKTypes",
    "EKObject",
    "EKError",
] }

[dev-dependencies]
futures = "0.3"
