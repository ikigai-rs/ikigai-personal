[package]
name = "ikigai-personal"
version = "0.10.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Personal contexts for ikigai — OS-backed resources (contacts, calendar, availability) under urn:personal:*. macOS-first; Windows and Linux build but report unsupported for now."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-personal"
homepage = "https://github.com/ikigai-rs/ikigai-personal"
readme = "README.md"
keywords = ["ikigai", "roc", "personal", "calendar", "contacts"]
categories = ["os"]

[dependencies]
# Core 0.4.3 provides optional argument readers.
ikigai-core = "0.4.3" # ActionSpec (per-verb contracts)
ikigai-http = "0.8.0" # auth::basic — the shared Authorization helper
# Decodes the uid captured from urn:personal:calendar:event:uid:{uid}; already in the
# graph through url.
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local-time period math (today/week/month partitions). Clock only — no parsing
# or serde surface.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The IANA time-zone database, for iCalendar times qualified by `TZID=` (a Google or
# iCloud feed writes every time that way). The version the ecosystem's tz module uses.
chrono-tz = "0.10"

# Real EventKit access, macOS only — the other platforms keep their clear
# "not supported yet" answer without pulling Apple frameworks.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
objc2-event-kit = { version = "0.3", features = [
    "EKEventStore",
    "EKEvent",
    "EKAlarm",
    "EKCalendar",
    "EKCalendarItem",
    "EKParticipant",
    "EKSource",
    "EKTypes",
    "EKObject",
    "EKError",
] }

[dev-dependencies]
futures = "0.3"
# Implements ikigai-http's `HttpTransport` for the in-memory server the remote tests use.
async-trait = "0.1"
